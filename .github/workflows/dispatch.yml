name: Dispatch to Devin Automation

on:
  issues:
    types: [labeled]

jobs:
  dispatch:
    if: github.event.label.name == 'devin-fix'
    runs-on: ubuntu-latest
    steps:
      - name: Send repository dispatch to devin-automation
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'alissa-hs',
              repo: 'devin-automation',
              event_type: 'devin-fix',
              client_payload: {
                issue_number: String(context.payload.issue.number),
                issue_title: context.payload.issue.title,
                issue_body: context.payload.issue.body,
                issue_url: context.payload.issue.html_url,
                repo: context.repo.owner + '/' + context.repo.repo
              }
            });
